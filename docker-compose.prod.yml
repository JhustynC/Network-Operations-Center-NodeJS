services:
  mongo-db:
    image: mongo:6.0.6
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    volumes:
      - ./mongo-data:/data/db
    ports:
      - "27017:27017"

  postgres-db:
    image: postgres:15.3
    restart: always
    environment:
      POSTGRES_URL: ${POSTGRES_URL}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    ports:
      - 5432:5432

  noc-app:
    image: jhustync/noc-app:1.0.0
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      PROD: "true"
      MONGO_PORT: 27017
      
      # Mailer
      MAILER_SERVICE: ${MAILER_SERVICE}
      MAILER_EMAIL: ${MAILER_EMAIL}
      MAILER_SECRET_KEY: ${MAILER_SECRET_KEY}
      
      # Mongo
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASS}@mongo-db:27017/
      MONGO_DB_NAME: ${MONGO_DB_NAME}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASS: ${MONGO_PASS}
      
      # Postgres
      POSTGRES_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
    depends_on:
      - mongo-db
      - postgres-db

